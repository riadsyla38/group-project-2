    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account</title>

    <link rel="stylesheet" href="css/account.css">
</head>

<body>

    <div class="accountContainer">

        <!-- LEFT SIDE -->

        <div class="profileSide">

            <img src="../images/defaultpfp.png"
            id="profileImage">

            <h1>Riad Syla</h1>

            <p>Traveler Explorer 🌍</p>

            <button id="editBtn">
                Edit Profile
            </button>

        </div>

        <!-- RIGHT SIDE -->

        <div class="infoSide">

            <h1>Account Information</h1>

            <div class="infoBox">
                <h3>Email</h3>
                <p>riad@example.com</p>
            </div>

            <div class="infoBox">
                <h3>Phone Number</h3>
                <p>+383 44 123 456</p>
            </div>

            <div class="infoBox">
                <h3>Country</h3>
                <p>Kosovo</p>
            </div>

            <div class="infoBox">
                <h3>Trips Booked</h3>
                <p>5 Trips</p>
            </div>

            <div class="infoBox">
                <h3>Favorite Destination</h3>
                <p>Santorini, Greece</p>
            </div>

            <a href="packages.html" id="backBtn">
                ← Return to Packages
            </a>

        </div>

    </div>

    <script src="js/account.js"></script>

</body>
